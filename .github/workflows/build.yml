name: Build Forge 1.20.1 port

on:
  push:
    branches:
      - forge-1.20.1-port
  pull_request:
    branches:
      - forge-1.20.1-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: ae2lt-forge-1.20.1
          path: build/libs/ae2lt-1.1.4-forge-1.20.1-r7.jar
          if-no-files-found: error
