name: Diagnose PR32 compile

on:
  push:
    branches:
      - port/2.0.6-tianshu-data-models

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Capture build output
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew clean compileJava compileTestJava test --no-daemon --stacktrace > pr32-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_ENV"
          tail -n 250 pr32-build.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: pr32-build-log
          path: pr32-build.log
          retention-days: 1
      - name: Preserve failure status
        run: exit "$exit_code"
